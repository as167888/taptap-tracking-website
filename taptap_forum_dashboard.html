        function buildAccordionDOM() {
            const container = document.getElementById('accordion-container');
            
            chartDataList.forEach((data, index) => {
                const isActive = data.isLatest ? 'active' : '';
                const tagHtml = data.isLatest ? `<span class="tag-latest">最新发布</span>` : '';
                
                const panelHtml = `
                    <div class="accordion-item ${isActive}" id="panel-${data.id}">
                        <div class="accordion-header" onclick="togglePanel('panel-${data.id}', '${data.id}')">
                            <h3>📅 ${data.title} ${tagHtml}</h3>
                            <span class="icon-arrow">▼</span>
                        </div>
                        <div class="accordion-content">
                            <div id="chart-${data.id}" class="chart-box"></div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', panelHtml);
                
                if (data.isLatest) {
                    setTimeout(() => renderChart(data.id), 0);
                }
            });
        }

        function renderChart(dataId) {
            const dataObj = chartDataList.find(item => item.id === dataId);
            if (!dataObj) return;
            
            const chartDomId = `chart-${dataId}`;
            const chartDom = document.getElementById(chartDomId);
            const myChart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: '#ffffff',
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                toolbox: {
                    feature: {
                        dataView: { show: true, readOnly: false, title: '数据视图' },
                        saveAsImage: { show: true, title: '保存为图片', pixelRatio: 2 }
                    },
                    right: '2%'
                },
                legend: { data: ['日均新增关注（个）', '日均新增发帖（条）'], top: 'bottom', itemGap: 30 },
                grid: { left: '5%', right: '5%', bottom: '15%', top: '15%', containLabel: true },
                xAxis: [
                    {
                        type: 'category',
                        data: dataObj.games,
                        axisPointer: { type: 'shadow' },
                        axisLabel: { interval: 0, rotate: 30, color: '#34495e', fontWeight: 'bold', margin: 15 }
                    }
                ],
                yAxis: [
                    {
                        type: 'value', name: '日均新增关注 (个)',
                        nameTextStyle: { color: '#3498db', fontWeight: 'bold' },
                        axisLabel: { color: '#3498db', formatter: '{value}' },
                        splitLine: { lineStyle: { type: 'dashed', color: '#ecf0f1' } }
                    },
                    {
                        type: 'value', name: '日均新增发帖 (条)',
                        nameTextStyle: { color: '#e67e22', fontWeight: 'bold' },
                        axisLabel: { color: '#e67e22', formatter: '{value}' },
                        splitLine: { show: false }
                    }
                ],
                series: [
                    {
                        name: '日均新增关注（个）', type: 'bar', barWidth: '40%',
                        itemStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: '#4facfe' }, { offset: 1, color: '#00f2fe' }
                            ]),
                            borderRadius: [6, 6, 0, 0]
                        },
                        data: dataObj.followers,
                        label: { show: true, position: 'top', color: '#2980b9', fontWeight: 'bold' }
                    },
                    {
                        name: '日均新增发帖（条）', type: 'line', yAxisIndex: 1, smooth: true,
                        symbol: 'emptyCircle', symbolSize: 10, itemStyle: { color: '#e67e22' },
                        lineStyle: { width: 4, type: 'dashed', shadowColor: 'rgba(230, 126, 34, 0.4)', shadowBlur: 10, shadowOffsetY: 5 },
                        data: dataObj.posts,
                        label: {
                            show: true, position: 'bottom', color: '#d35400', fontWeight: 'bold',
                            backgroundColor: 'rgba(255,255,255,0.8)', padding: [2, 4], borderRadius: 4
                        }
                    }
                ]
            };
            
            myChart.setOption(option);
            chartInstances[dataId] = myChart;
        }

        function togglePanel(panelId, dataId) {
            const panel = document.getElementById(panelId);
            const isActive = panel.classList.contains('active');

            if (isActive) {
                panel.classList.remove('active');
            } else {
                panel.classList.add('active');
                if (!chartInstances[dataId]) {
                    renderChart(dataId);
                } else {
                    chartInstances[dataId].resize();
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            buildAccordionDOM();
        });

        window.addEventListener('resize', function() {
            for (let id in chartInstances) {
                chartInstances[id].resize();
            }
        });
    </script>
</body>
</html>

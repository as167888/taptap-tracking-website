<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapTap 每周日均新增下载与评论跟踪</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f7f9fc;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            gap: 20px;
            display: flex;
            flex-direction: column;
        }
        .panel {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 20px;
        }
        #main {
            width: 100%;
            height: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h2 { margin: 0; color: #333; font-size: 24px; }
        .header p { color: #666; font-size: 14px; margin-top: 5px; }
        
        /* 备注样式，与 forum_trends 保持一致 */
        .note {
            margin-top: 20px;
            padding: 12px 16px;
            background-color: #f8f9fa;
            border-left: 4px solid #5470C6;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">
            <div class="header">
                <h2>TapTap 每周数据跟踪分析</h2>
                <p>日均新增下载趋势 vs 日均新增评论趋势</p>
            </div>
            
            <div id="main"></div>
            
            <div class="note">
                <strong>💡 数据说明：</strong>跟踪范围为每周新增下载量前600名的游戏（每周的样本会存在差异），日均新增采用同口径的方法计算，即提取本周新增下载前600游戏的本周数据和上周数据做差。
            </div>
        </div>
    </div>

    <script>
        var myChart = echarts.init(document.getElementById('main'));

        // 初始表格自带的数据（2025-06-08 至 2026-05-02）
        const dates = ["2025-06-08", "2025-06-15", "2025-06-21", "2025-06-28", "2025-07-05", "2025-07-12", "2025-07-19", "2025-07-27", "2025-08-02", "2025-08-09", "2025-08-16", "2025-08-24", "2025-08-30", "2025-09-06", "2025-09-15", "2025-09-22", "2025-09-27", "2025-10-06", "2025-10-12", "2025-10-18", "2025-10-25", "2025-11-01", "2025-11-08", "2025-11-15", "2025-11-22", "2025-11-29", "2025-12-06", "2025-12-13", "2025-12-20", "2025-12-27", "2026-01-03", "2026-01-10", "2026-01-18", "2026-01-24", "2026-01-31", "2026-02-07", "2026-02-16", "2026-02-24", "2026-03-02", "2026-03-11", "2026-03-14", "2026-03-21", "2026-03-28", "2026-04-05", "2026-04-11", "2026-04-18", "2026-04-25", "2026-05-02", "2026-05-10"];
        const downloads = [120.45, 144.26, 136.52, 153.07, 189.37, 183.45, 179.98, 187.03, 178.53, 174.24, 177.68, 149.01, 148.14, 106.32, 111.82, 100.64, 89.43, 150.35, 110.47, 93.26, 99.75, 107.09, 117.46, 105.26, 105.22, 113.0, 112.55, 100.19, 100.43, 98.76, 136.32, 94.51, 124.57, 118.21, 145.02, 172.81, 192.97, 184.38, 160.01, 116.77, 96.66, 117.13, 111.42, 132.1, 116.95, 113.71, 110.54, 148.05, 129.91];
        const comments = [0.394, 0.4179, 0.3858, 0.3838, 0.4172, 0.4718, 0.4937, 0.5399, 0.5068, 0.4496, 0.4314, 0.3809, 0.3943, 0.3012, 0.2964, 0.234, 0.2636, 0.3695, 0.3509, 0.2366, 0.2636, 0.335, 0.3272, 0.2648, 0.0786, -0.1649, 0.3269, 0.2626, 0.2402, 0.2828, 0.5928, 0.5973, 0.3762, 0.4059, 0.6018, 0.5909, 0.5068, 0.4136, 0.3834, 0.3078, 0.2454, 0.2654, 0.2565, 0.3429, 0.3365, 0.3194, 0.3627, 0.5239, 0.4147];

        function renderChart() {
            var option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross', crossStyle: { color: '#999' } }
                },
                toolbox: {
                    feature: {
                        dataView: { show: true, readOnly: false, title: '数据视图' },
                        magicType: { show: true, type: ['line', 'bar'], title: { line: '切换为折线图', bar: '切换为柱状图' } },
                        restore: { show: true, title: '还原' },
                        saveAsImage: { show: true, title: '保存为图片' }
                    }
                },
                legend: {
                    data: ['日均新增下载（万/日）', '日均新增评论（万/日）'],
                    top: 'bottom'
                },
                grid: { left: '5%', right: '5%', bottom: '10%', containLabel: true },
                dataZoom: [ { type: 'inside', start: 0, end: 100 }, { start: 0, end: 100 } ],
                xAxis: [
                    {
                        type: 'category',
                        data: dates,
                        axisPointer: { type: 'shadow' },
                        axisLabel: { color: '#666' },
                        axisLine: { lineStyle: { color: '#ccc' } }
                    }
                ],
                yAxis: [
                    {
                        type: 'value',
                        name: '新增下载 (万/日)',
                        axisLabel: { formatter: '{value}' },
                        nameTextStyle: { color: '#5470C6', fontWeight: 'bold' }
                    },
                    {
                        type: 'value',
                        name: '新增评论 (万/日)',
                        axisLabel: { formatter: '{value}' },
                        nameTextStyle: { color: '#EE6666', fontWeight: 'bold' },
                        splitLine: { show: false }
                    }
                ],
                series: [
                    {
                        name: '日均新增下载（万/日）',
                        type: 'bar',
                        itemStyle: { color: '#5470C6', borderRadius: [4, 4, 0, 0] },
                        data: downloads
                    },
                    {
                        name: '日均新增评论（万/日）',
                        type: 'line',
                        yAxisIndex: 1,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        itemStyle: { color: '#EE6666' },
                        lineStyle: { width: 3, shadowColor: 'rgba(238, 102, 102, 0.3)', shadowBlur: 10, shadowOffsetY: 5 },
                        data: comments
                    }
                ]
            };
            myChart.setOption(option);
        }

        renderChart();

        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
